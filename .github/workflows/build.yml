name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Test
      - name: Keep portable build
        uses: actions/upload-artifact@v7
        with:
          name: StayLit-windows
          path: |
            dist/StayLit-*-win.zip
            dist/SHA256SUMS.txt
            build/test-report.txt
          if-no-files-found: error
          retention-days: 14
